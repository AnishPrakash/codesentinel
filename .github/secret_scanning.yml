# GitHub secret-scanning exclusions.
#
# This is a security scanner. Its test fixtures and demo files contain
# deliberately fake credentials, because a rule that detects hardcoded secrets
# cannot be tested without something shaped like a hardcoded secret.
#
# Excluding these paths stops GitHub opening an alert every time we add a
# fixture. It does NOT excuse a real credential: nothing outside these paths is
# excluded, and a real key committed here would still be flagged.
#
# If an alert has already been opened for a file listed here, this file does not
# close it - close it in Security > Secret scanning, marking it "Used in tests".
paths-ignore:
  - "tests/fixtures/**"
  - "tests/test_*.py"
  - "demo/**"
